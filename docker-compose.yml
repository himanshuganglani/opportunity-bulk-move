services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opportunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_move_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  initialize:
    build:
      context: .
    command:
      - sh
      - -c
      - npm run db:migrate && npm run db:seed:small
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opportunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_move_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    command: ["node", "dist/main.js"]
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opportunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_move_db}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
    command: ["node", "dist/worker.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-opportunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-opportunity_move_db}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-2}
      BULK_MOVE_CHUNK_SIZE: ${BULK_MOVE_CHUNK_SIZE:-100}
      BULK_MOVE_LEASE_MS: ${BULK_MOVE_LEASE_MS:-30000}
      BULK_MOVE_MAX_ATTEMPTS: ${BULK_MOVE_MAX_ATTEMPTS:-8}
      BULK_MOVE_BACKOFF_BASE_MS: ${BULK_MOVE_BACKOFF_BASE_MS:-500}
      BULK_MOVE_BACKOFF_MAX_MS: ${BULK_MOVE_BACKOFF_MAX_MS:-60000}
      BULK_MOVE_CHUNK_PAUSE_MS: ${BULK_MOVE_CHUNK_PAUSE_MS:-50}
      BULK_MOVE_POLL_MS: ${BULK_MOVE_POLL_MS:-500}
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
